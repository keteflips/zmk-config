name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3
    with:
      # Combina el número de PR o la rama (sin "/") con el número de ejecución
      archive_name: "zmk-build-${{ github.event.pull_request.number || github.ref_name }}-run-${{ github.run_number }}"
